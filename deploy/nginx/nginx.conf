# Internal ingress (ADR-0031): TLS termination in front of the API, nothing else.
# Listens on 8443 inside the container (no privileged port, so no capabilities are needed
# for it); compose publishes it. Certificates come from secret files (your organisation's
# CA in production; `make certs` makes a local CA for development and the offline test).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    # Path only ($uri), never the query string, which may carry search terms.
    log_format access escape=json
        '{"ts":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration_s":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout access;

    # The root filesystem is read-only; temporary files go to the tmpfs at /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Uploads: the API enforces the exact limit (NGOCR_MAX_UPLOAD_BYTES, 50 MiB by default);
    # this stops anything far larger before it reaches it. Bodies stream to the API.
    client_max_body_size 51m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 16k;

    # Per-address limits (OD-36): sign-in attempts, and requests overall.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        # Mozilla "intermediate" profile: TLS 1.2 and 1.3 only, forward-secret AEAD ciphers.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Replace, never append: clients cannot inject addresses.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 120s;

        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            limit_conn conn 30;
            proxy_pass http://api;
        }
    }
}
