<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Review queue</title>
<link rel="stylesheet" href="/review/static/review.css">
<script src="/review/static/review.js" defer></script>
</head>
<body>
<header>
  <h1>Review queue</h1>
  <span id="who"></span>
  <button id="logout" hidden>Sign out</button>
</header>

<section id="login" class="panel">
  <h2>Sign in</h2>
  <p>Paste your API token. It is kept in this browser tab only (session storage) and sent
     to this server only.</p>
  <form id="login-form">
    <input id="token" type="password" autocomplete="off" spellcheck="false"
           placeholder="ngocr_…" aria-label="API token" required>
    <button type="submit">Sign in</button>
  </form>
  <p id="login-error" class="error" role="alert"></p>
</section>

<main id="app" hidden>
  <aside id="queue" class="panel">
    <div class="row">
      <label>Status
        <select id="status-filter">
          <option value="open">Open</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="auto_accepted">Auto-accepted</option>
        </select>
      </label>
      <button id="refresh">Refresh</button>
    </div>
    <p id="queue-count" class="muted"></p>
    <ol id="queue-list"></ol>
  </aside>

  <section id="item" class="panel" hidden>
    <div id="item-head"></div>
    <div id="item-actions" class="row"></div>
    <p id="item-error" class="error" role="alert"></p>
    <h2>Fields</h2>
    <table id="fields">
      <thead><tr><th>Field</th><th>Value</th><th>Source</th><th>Check</th><th>Decision</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="tables"></div>
    <h2>Checks</h2>
    <ul id="checks"></ul>
    <h2>Page</h2>
    <div class="row">
      <label>Page <input id="page-number" type="number" min="1" value="1"></label>
      <span id="page-field" class="muted"></span>
    </div>
    <img id="page-image" alt="Source page with the selected evidence highlighted">
    <h2>History</h2>
    <ol id="history"></ol>
  </section>
</main>
</body>
</html>
