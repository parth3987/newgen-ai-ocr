name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.13.1

      - name: Create environment from locks
        run: make venv

      - name: System packages (Tesseract binary, Noto fonts for the evaluation corpus)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-noto-core

      - name: Fetch pinned OCR models (staging step; hashes verified against models.lock.json)
        run: make models

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test

      - name: Bandit and dependency audit
        run: make security

      - name: License allowlist
        run: make licenses

      - name: Secret scan
        run: make secrets

      - name: SBOM
        run: make sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/sbom-runtime.cdx.json
