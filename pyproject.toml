[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newgen-ocr"
version = "0.1.0"
description = "New Gen AI OCR - Precision Data Extraction (self-hosted, offline, CPU-only)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
# Runtime dependencies are declared in requirements.in and pinned (with hashes)
# in requirements.lock. They are intentionally not duplicated here.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Built-in extraction schemas ship with the package (ADR-0026).
newgen_ocr = ["py.typed", "extraction/schemas/*.json"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit rules
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",
    "BLE",      # blind except
    "T20",      # no print()
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the pytest idiom. S106: dummy passwords encrypt synthetic test PDFs.
"tests/**" = ["S101", "S106"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["newgen_ocr"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship no type information; their use is confined to newgen_ocr.pdf / newgen_ocr.ocr.
module = ["pypdfium2", "pypdfium2.*", "paddle", "paddle.*", "paddlex", "paddlex.*", "paddleocr", "paddleocr.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "models: needs OCR models fetched by scripts/fetch_models.py (auto-skipped if absent)",
    "tesseract: needs the tesseract binary (auto-skipped if absent)",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["newgen_ocr"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
